<!doctype html>
<html lang="zh-TW" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>卡雅音樂教室 - 雲端管理系統 (完整功能版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
  
  <style>
    body { box-sizing: border-box; font-family: 'Microsoft JhengHei', sans-serif; }
    .calendar-day { width: 38px; height: 38px; border-radius: 6px; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; background: white; border: 2px solid #F9A8D4; color: #1a1a1a; position: relative; }
    .calendar-day.has-booking::after { content: ''; position: absolute; width: 6px; height: 6px; background: #DC2626; border-radius: 50%; top: 3px; right: 3px; z-index: 3; }
    .calendar-day.red-circle::before { content: ''; position: absolute; width: 32px; height: 32px; border: 2px solid #DC2626; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1; }
    .calendar-day.selected { background: linear-gradient(135deg, #EC4899 0%, #DB2777 100%); color: white; transform: scale(1.1); }
    .calendar-day.disabled { opacity: 0.35; cursor: not-allowed; }
    .room-card { border: 2px solid #F9A8D4; border-radius: 8px; padding: 10px 15px; cursor: pointer; background: white; text-align: center; }
    .room-card.active { background: linear-gradient(135deg, #EC4899 0%, #DB2777 100%); color: white; }
    .btn-primary { background: linear-gradient(135deg, #10B981 0%, #059669 100%); color: white; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; }
    .btn-secondary { background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%); color: white; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; }
    .btn-edit { background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%); color: white; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; }
    .input-pink { border: 2px solid #F9A8D4; border-radius: 8px; padding: 10px; width: 100%; font-weight: 600; }
    .status-badge { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; color: white; }
    .status-paid { background: #10B981; }
    .status-pending { background: #F59E0B; }
    .booking-card { border: 2px solid #F9A8D4; background: white; border-radius: 10px; padding: 12px; }
    .rule-alert { background: #FEE2E2; border: 2px solid #EF4444; color: #B91C1C; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 13px; text-align: center; }
    .holiday-badge { position: absolute; top: -2px; left: -2px; background: #DC2626; color: white; font-size: 8px; padding: 1px 4px; border-radius: 4px; z-index: 4; }
    
    /* 彈出視窗樣式 */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
    .modal-content { background: white; padding: 25px; border-radius: 20px; width: 90%; max-width: 500px; border: 4px solid #F9A8D4; }
  </style>
</head>
<body class="h-full bg-pink-50">

  <div id="edit-modal" class="modal-overlay">
    <div class="modal-content">
      <h3 class="text-xl font-bold text-pink-900 mb-4">✏️ 修改預約資料</h3>
      <div class="space-y-4">
        <input type="hidden" id="edit-id">
        <div><label class="text-xs font-bold text-gray-500">預約人姓名</label><input type="text" id="edit-name" class="input-pink"></div>
        <div><label class="text-xs font-bold text-gray-500">WhatsApp 電話</label><input type="tel" id="edit-phone" class="input-pink"></div>
        <div class="grid grid-cols-2 gap-4">
          <div><label class="text-xs font-bold text-gray-500">開始時間</label><select id="edit-start" class="input-pink"></select></div>
          <div><label class="text-xs font-bold text-gray-500">結束時間</label><select id="edit-end" class="input-pink"></select></div>
        </div>
        <div><label class="text-xs font-bold text-gray-500">金額 ($)</label><input type="number" id="edit-amount" class="input-pink"></div>
        <div><label class="text-xs font-bold text-gray-500">備註</label><textarea id="edit-notes" class="input-pink" rows="2"></textarea></div>
        <div class="flex gap-3 pt-2">
          <button onclick="saveEdit()" class="btn-primary flex-1">✅ 儲存修改</button>
          <button onclick="closeEditModal()" class="bg-gray-400 text-white px-4 py-2 rounded-lg font-bold">取消</button>
        </div>
      </div>
    </div>
  </div>

  <div id="login-overlay" class="fixed inset-0 bg-pink-100 z-50 flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-2xl border-4 border-pink-300 max-w-sm w-full">
      <h2 class="text-2xl font-bold text-pink-900 mb-6 text-center">🎵 卡雅音樂教室</h2>
      <button onclick="enterMode('public')" class="btn-secondary w-full mb-4 py-3 text-lg">🌐 公開預約系統</button>
      <div class="border-t border-gray-200 my-4"></div>
      <input type="password" id="staff-pw" class="input-pink mb-4" placeholder="輸入管理密碼">
      <button onclick="enterMode('staff')" class="btn-primary w-full py-3 text-lg">👨‍💼 工作人員登入</button>
    </div>
  </div>

  <div id="app-content" class="h-full flex flex-col overflow-hidden" style="display: none;">
    <header class="bg-pink-600 text-white px-6 py-3 shadow-lg flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-3xl">🎵</span>
        <div><h1 class="font-bold text-lg">卡雅音樂教室</h1><p class="text-[10px]">上水符興街43-45號1B室 | 📞 5400 1874</p></div>
      </div>
      <div class="flex items-center gap-4">
        <div id="staff-stats" class="hidden text-right"><p class="text-[10px]">本月收入</p><p id="month-income" class="font-bold text-lg">$0</p></div>
        <button onclick="location.reload()" class="bg-pink-800 px-3 py-1 rounded text-xs">登出</button>
      </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
      <section class="flex-1 overflow-y-auto p-6 space-y-6 bg-white">
        <div class="border-2 border-pink-100 p-5 rounded-xl shadow-sm">
          <h3 class="font-bold text-pink-900 mb-3">🎹 1. 選擇房間</h3>
          <div class="flex flex-wrap gap-2" id="room-grid"></div>
        </div>

        <div class="border-2 border-pink-100 p-5 rounded-xl shadow-sm">
          <div class="flex justify-between items-center mb-3">
            <h3 class="font-bold text-pink-900">📅 2. 選擇日期</h3>
            <div class="flex gap-2 text-xs">
              <button onclick="changeMonth(-1)" class="text-pink-600 border border-pink-300 px-2 py-1 rounded">上月</button>
              <button onclick="changeMonth(1)" class="text-pink-600 border border-pink-300 px-2 py-1 rounded">下月</button>
            </div>
          </div>
          <div id="calendar-month-title" class="text-center font-bold text-sm text-pink-700 mb-2"></div>
          <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-bold mb-1">
            <div class="text-red-500">日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div class="text-blue-500">六</div>
          </div>
          <div id="calendar-grid" class="grid grid-cols-7 gap-1"></div>
          <div id="selected-dates-list" class="mt-3 flex flex-wrap gap-1"></div>
        </div>

        <div class="border-2 border-pink-100 p-5 rounded-xl shadow-sm space-y-4">
          <h3 class="font-bold text-pink-900">⏰ 3. 時段與詳情</h3>
          <div class="rule-alert">⚠️ 網上預約不接受少於24小時的預約</div>
          <div class="grid grid-cols-2 gap-4">
            <select id="start-time" class="input-pink" onchange="calculate()"></select>
            <select id="end-time" class="input-pink" onchange="calculate()"></select>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <input type="text" id="user-name" placeholder="預約人姓名" class="input-pink">
            <input type="tel" id="user-phone" placeholder="WhatsApp 電話" class="input-pink">
          </div>
          <div id="video-option" class="hidden"><label class="flex items-center gap-2 font-bold text-amber-700"><input type="checkbox" id="has-video" onchange="calculate()"> 📹 加購錄影服務</label></div>
          <div class="bg-yellow-50 p-4 rounded-lg text-center border border-yellow-200">
            <p class="text-xs font-bold text-gray-500">預計費用</p>
            <p id="display-total" class="text-2xl font-bold text-pink-600">$0</p>
          </div>
          <button id="submit-btn" onclick="handleBooking()" class="btn-primary w-full text-lg">📝 提交預約申請</button>
        </div>
      </section>

      <aside id="admin-sidebar" class="w-[380px] bg-pink-50 border-l-2 border-pink-200 overflow-y-auto p-4 hidden">
        <h3 class="font-bold text-pink-900 mb-4 border-b border-pink-300 pb-2">📋 預約清單 (雲端同步)</h3>
        <div id="booking-list" class="space-y-3"></div>
      </aside>
    </main>
  </div>

  <script>
    // --- 1. 配置 (已自動填入 Karen 的憑證) ---
    const firebaseConfig = {
      apiKey: "AIzaSyDEcKa0OlmdJXowWV-Esr5EAgYoHRMaCfs",
      authDomain: "cms-booking-c8bad.firebaseapp.com",
      databaseURL: "https://cms-booking-c8bad-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "cms-booking-c8bad",
      storageBucket: "cms-booking-c8bad.firebasestorage.app",
      messagingSenderId: "994097211619",
      appId: "1:994097211619:web:bc1626b253b02381ca3dd6"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const bookingsRef = db.ref('bookings');
    const EMAIL_API = "https://script.google.com/macros/s/AKfycbzvnj29GP2k1dIDI6lMcpNxkg924NCqh99lCHDAs9jli2M8MF9Kxd99gX6V1Mf6j7W2/exec";

    const rooms = [
      { id: 'A', name: '房A', sub: '(三角琴)', rates: { weekday: 280, weekend: 380 }, vRates: { weekday: 580, weekend: 680 }, hasVideo: true },
      { id: 'B', name: '房B', sub: '(直身琴)', rates: { weekday: 60, weekend: 90 } },
      { id: 'C', name: '房C', sub: '(數碼琴)', rates: { weekday: 60, weekend: 90 } },
      { id: 'D', name: '房D', sub: '(直身琴)', rates: { weekday: 60, weekend: 90 } },
      { id: 'E', name: '房E', sub: '(直身琴)', rates: { weekday: 60, weekend: 90 } },
      { id: '1', name: '房1', sub: '(活動)', rates: { weekday: 100, weekend: 150 } },
      { id: '2', name: '房2', sub: '(伴奏)', rates: { weekday: 80, weekend: 120 } }
    ];

    const holidays = { '2026-05-01': '勞動節', '2026-05-25': '佛誕', '2026-06-19': '端午節', '2026-07-01': '特區成立', '2026-10-01': '國慶', '2026-12-25': '聖誕' };

    let bookings = [];
    let selectedDates = [];
    let currentRoom = null;
    let viewDate = new Date();
    let isStaff = false;

    // --- 2. 初始化 ---

    function enterMode(mode) {
      if (mode === 'staff') {
        if (document.getElementById('staff-pw').value !== 'kaya2026') return alert('密碼錯誤');
        isStaff = true;
        document.getElementById('admin-sidebar').classList.remove('hidden');
        document.getElementById('staff-stats').classList.remove('hidden');
        document.getElementById('submit-btn').innerText = "✅ 管理員直接登記";
      }
      document.getElementById('login-overlay').style.display = 'none';
      document.getElementById('app-content').style.display = 'flex';
      initUI();
    }

    function initUI() {
      // 生成房間
      const grid = document.getElementById('room-grid');
      rooms.forEach(r => {
        const div = document.createElement('div');
        div.className = 'room-card text-xs font-bold';
        div.innerHTML = `${r.name}<br>${r.sub}`;
        div.onclick = () => {
          currentRoom = r;
          document.querySelectorAll('.room-card').forEach(el => el.classList.remove('active'));
          div.classList.add('active');
          document.getElementById('video-option').style.display = r.hasVideo ? 'block' : 'none';
          calculate();
        };
        grid.appendChild(div);
      });

      // 生成時間選單
      const start = document.getElementById('start-time');
      const end = document.getElementById('end-time');
      const editS = document.getElementById('edit-start');
      const editE = document.getElementById('edit-end');
      for (let h = 8; h <= 21; h++) {
        [0, 30].forEach(m => {
          const t = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
          const opt = `<option value="${t}">${t}</option>`;
          start.innerHTML += opt; end.innerHTML += opt;
          editS.innerHTML += opt; editE.innerHTML += opt;
        });
      }
      const last = `<option value="22:00">22:00</option>`;
      end.innerHTML += last; editE.innerHTML += last;

      // 雲端監聽
      bookingsRef.on('value', snap => {
        const data = snap.val();
        bookings = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
        renderCalendar();
        if (isStaff) renderAdminList();
      });
    }

    // --- 3. 核心邏輯 ---

    function renderCalendar() {
      const grid = document.getElementById('calendar-grid'); grid.innerHTML = '';
      const year = viewDate.getFullYear(); const month = viewDate.getMonth();
      document.getElementById('calendar-month-title').innerText = `${year}年 ${month + 1}月`;
      const first = new Date(year, month, 1).getDay();
      const days = new Date(year, month + 1, 0).getDate();
      const today = new Date(); today.setHours(0,0,0,0);

      for (let i = 0; i < first; i++) grid.appendChild(document.createElement('div'));

      for (let d = 1; d <= days; d++) {
        const dStr = `${year}-${(month+1).toString().padStart(2,'0')}-${d.toString().padStart(2,'0')}`;
        const date = new Date(year, month, d);
        const div = document.createElement('div');
        div.className = 'calendar-day';
        if (date < today && !isStaff) div.classList.add('disabled');
        if (holidays[dStr] || date.getDay() === 0 || date.getDay() === 6) div.classList.add('red-circle');
        if (bookings.some(b => b.start_date === dStr && b.room_id === currentRoom?.id)) div.classList.add('has-booking');
        if (selectedDates.includes(dStr)) div.classList.add('selected');
        div.innerHTML = `<span>${d}</span>`;
        if (holidays[dStr]) div.innerHTML += `<div class="holiday-badge">${holidays[dStr]}</div>`;
        div.onclick = () => {
          if (date < today && !isStaff) return;
          if (selectedDates.includes(dStr)) selectedDates = selectedDates.filter(x => x !== dStr);
          else selectedDates.push(dStr);
          renderCalendar(); updateDateList(); calculate();
        };
        grid.appendChild(div);
      }
    }

    function updateDateList() {
      document.getElementById('selected-dates-list').innerHTML = selectedDates.map(d => `<span class="bg-pink-600 text-white text-[10px] px-2 py-1 rounded-full font-bold">${d}</span>`).join('');
    }

    function changeMonth(s) { viewDate.setMonth(viewDate.getMonth() + s); renderCalendar(); }

    function calculate() {
      if (!currentRoom || selectedDates.length === 0) return;
      const s = document.getElementById('start-time').value.split(':').map(Number);
      const e = document.getElementById('end-time').value.split(':').map(Number);
      const dur = (e[0]*60 + e[1]) - (s[0]*60 + s[1]);
      if (dur < 60) { document.getElementById('display-total').innerText = "最少1小時"; return; }
      let total = 0;
      selectedDates.forEach(d => {
        const isHoli = holidays[d] || [0, 6].includes(new Date(d).getDay());
        const video = document.getElementById('has-video').checked && currentRoom.id === 'A';
        let rate = isHoli ? currentRoom.rates.weekend : currentRoom.rates.weekday;
        if (video) rate = isHoli ? currentRoom.vRates.weekend : currentRoom.vRates.weekday;
        total += (rate * (dur / 60));
      });
      document.getElementById('display-total').innerText = `$${Math.round(total)}`;
    }

    async function handleBooking() {
      const name = document.getElementById('user-name').value;
      const phone = document.getElementById('user-phone').value;
      const start = document.getElementById('start-time').value;
      const end = document.getElementById('end-time').value;
      if (!currentRoom || selectedDates.length === 0 || !name || !phone) return alert('請填寫完整');
      
      // 24小時檢查
      if (!isStaff) {
        const now = new Date();
        const limit = new Date(now.getTime() + (24 * 60 * 60 * 1000));
        for (let d of selectedDates) {
          if (new Date(`${d}T${start}`) < limit) return alert('❌ 網上不接受少於24小時的預約，請致電查詢。');
        }
      }

      const totalText = document.getElementById('display-total').innerText;
      if (totalText.includes('小時')) return alert('時長錯誤');
      
      const totalNum = parseInt(totalText.replace('$',''));

      for (let d of selectedDates) {
        await bookingsRef.push({
          room_id: currentRoom.id, start_date: d, start_time: start, end_time: end,
          user_name: name, phone: phone, total_amount: Math.round(totalNum/selectedDates.length),
          payment_status: isStaff ? 'paid' : 'pending', created_at: new Date().toISOString(), notes: ""
        });
      }

      // 發送 Email
      fetch(EMAIL_API, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ user_name: name, phone: phone, room: currentRoom.name, dates: selectedDates.join(','), time: `${start}-${end}`, price: totalText }) });

      alert('預約提交成功！');
      location.reload();
    }

    // --- 4. 管理員編輯功能 ---

    function renderAdminList() {
      const container = document.getElementById('booking-list'); container.innerHTML = '';
      let income = 0; const currentMonth = new Date().getMonth();
      bookings.sort((a,b) => b.start_date.localeCompare(a.start_date)).forEach(b => {
        if (b.payment_status === 'paid' && new Date(b.start_date).getMonth() === currentMonth) income += b.total_amount;
        const div = document.createElement('div');
        div.className = 'booking-card text-xs space-y-2';
        div.innerHTML = `
          <div class="flex justify-between font-bold">
            <span>房${b.room_id} - ${b.user_name}</span>
            <span class="status-badge ${b.payment_status==='paid'?'status-paid':'status-pending'}">${b.payment_status==='paid'?'已付':'待付'}</span>
          </div>
          <p>📅 ${b.start_date} | ⏰ ${b.start_time}-${b.end_time}</p>
          <p>📱 ${b.phone} | 💰 $${b.total_amount}</p>
          ${b.notes ? `<p class="text-gray-500 font-bold">📝 ${b.notes}</p>` : ''}
          <div class="flex gap-2 pt-1">
            ${b.payment_status==='pending'?`<button onclick="setPaid('${b.id}')" class="bg-green-500 text-white px-2 py-1 rounded">收錢</button>`:''}
            <button onclick="openEditModal('${b.id}')" class="btn-edit">✏️ 編輯</button>
            <button onclick="delBooking('${b.id}')" class="bg-gray-400 text-white px-2 py-1 rounded">刪除</button>
          </div>
        `;
        container.appendChild(div);
      });
      document.getElementById('month-income').innerText = `$${Math.round(income)}`;
    }

    // 編輯 Modal 邏輯
    window.openEditModal = (id) => {
      const b = bookings.find(x => x.id === id);
      if (!b) return;
      document.getElementById('edit-id').value = id;
      document.getElementById('edit-name').value = b.user_name;
      document.getElementById('edit-phone').value = b.phone;
      document.getElementById('edit-start').value = b.start_time;
      document.getElementById('edit-end').value = b.end_time;
      document.getElementById('edit-amount').value = b.total_amount;
      document.getElementById('edit-notes').value = b.notes || "";
      document.getElementById('edit-modal').style.display = 'flex';
    };

    window.closeEditModal = () => document.getElementById('edit-modal').style.display = 'none';

    window.saveEdit = async () => {
      const id = document.getElementById('edit-id').value;
      const updateData = {
        user_name: document.getElementById('edit-name').value,
        phone: document.getElementById('edit-phone').value,
        start_time: document.getElementById('edit-start').value,
        end_time: document.getElementById('edit-end').value,
        total_amount: parseInt(document.getElementById('edit-amount').value),
        notes: document.getElementById('edit-notes').value
      };
      await db.ref('bookings/' + id).update(updateData);
      alert('已成功修改資料！');
      closeEditModal();
    };

    window.setPaid = id => db.ref('bookings/'+id).update({ payment_status: 'paid' });
    window.delBooking = id => confirm('確定永久刪除此紀錄？') && db.ref('bookings/'+id).remove();

  </script>
</body>
</html>

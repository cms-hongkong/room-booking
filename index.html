<!doctype html>
<html lang="zh-TW" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>卡雅音樂教室 - 雲端預約管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
  
  <style>
    body { box-sizing: border-box; font-family: 'Microsoft JhengHei', sans-serif; }
    .calendar-day { width: 38px; height: 38px; border-radius: 6px; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; background: white; border: 2px solid #F9A8D4; color: #1a1a1a; position: relative; }
    .calendar-day.has-booking::after { content: ''; position: absolute; width: 6px; height: 6px; background: #DC2626; border-radius: 50%; top: 3px; right: 3px; z-index: 3; }
    .calendar-day.red-circle::before { content: ''; position: absolute; width: 32px; height: 32px; border: 2px solid #DC2626; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1; }
    .calendar-day:hover:not(.disabled) { background: #FCE7F3; transform: scale(1.15); z-index: 10; border-color: #EC4899; }
    .calendar-day.selected { background: linear-gradient(135deg, #EC4899 0%, #DB2777 100%); color: white; transform: scale(1.1); border-color: #BE185D; }
    .calendar-day.today { border: 3px solid #F59E0B; }
    .calendar-day.disabled { opacity: 0.35; cursor: not-allowed; }
    .room-card { border: 2px solid #F9A8D4; border-radius: 8px; padding: 10px 20px; cursor: pointer; transition: all 0.3s; background: white; text-align: center; }
    .room-card.active { background: linear-gradient(135deg, #EC4899 0%, #DB2777 100%); color: white; }
    .btn-primary { background: linear-gradient(135deg, #10B981 0%, #059669 100%); color: white; padding: 12px; border-radius: 10px; font-weight: 700; }
    .btn-secondary { background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%); color: white; padding: 12px; border-radius: 10px; font-weight: 700; }
    .input-pink { border: 2px solid #F9A8D4; border-radius: 8px; padding: 10px; width: 100%; }
    .status-badge { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; color: white; }
    .status-paid { background: #10B981; }
    .status-pending { background: #F59E0B; }
    .booking-card { border: 2px solid #F9A8D4; background: white; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .holiday-badge { position: absolute; top: -2px; left: -2px; background: red; color: white; font-size: 8px; padding: 1px 4px; border-radius: 4px; }
  </style>
</head>
<body class="h-full bg-pink-50">

  <div id="login-overlay" class="fixed inset-0 bg-pink-100 z-50 flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-2xl border-4 border-pink-300 max-w-sm w-full">
      <h2 class="text-2xl font-bold text-pink-900 mb-6 text-center">🎵 卡雅音樂教室</h2>
      <button onclick="enterMode('public')" class="btn-secondary w-full mb-4">🌐 公開預約系統</button>
      <div class="border-t border-gray-200 my-4"></div>
      <input type="password" id="staff-pw" class="input-pink mb-4" placeholder="輸入管理密碼">
      <button onclick="enterMode('staff')" class="btn-primary w-full">👨‍💼 工作人員登入</button>
    </div>
  </div>

  <div id="app-content" class="h-full flex flex-col" style="display: none;">
    <header class="bg-pink-600 text-white p-4 shadow-lg flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-3xl">🎵</span>
        <div>
          <h1 class="font-bold text-xl">卡雅音樂教室</h1>
          <p class="text-xs opacity-80">上水符興街43-45號1B室 | 5400 1874</p>
        </div>
      </div>
      <div class="flex gap-4 items-center">
        <div id="stats" class="hidden md:flex gap-4">
          <div class="text-right"><p class="text-xs">本月收入</p><p id="month-income" class="font-bold">$0</p></div>
        </div>
        <button onclick="location.reload()" class="bg-pink-800 px-3 py-1 rounded text-xs">登出</button>
      </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
      <section class="flex-1 overflow-y-auto p-6 space-y-6" id="form-container">
        <div class="bg-white p-6 rounded-xl shadow border-2 border-pink-200">
          <h3 class="font-bold text-pink-900 mb-4">🎹 1. 選擇房間</h3>
          <div class="grid grid-cols-4 gap-2" id="room-grid"></div>
          <div id="room-desc" class="mt-4 p-4 bg-pink-50 rounded-lg hidden"></div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow border-2 border-pink-200">
          <h3 class="font-bold text-pink-900 mb-4">📅 2. 選擇日期</h3>
          <div class="flex justify-between mb-4">
            <button onclick="changeMonth(-1)" class="text-pink-600">◀ 上月</button>
            <span id="calendar-month" class="font-bold"></span>
            <button onclick="changeMonth(1)" class="text-pink-600">下月 ▶</button>
          </div>
          <div class="grid grid-cols-7 gap-2 text-center text-xs mb-2">
            <div class="text-red-500">日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div class="text-blue-500">六</div>
          </div>
          <div id="calendar-grid" class="grid grid-cols-7 gap-2"></div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow border-2 border-pink-200">
          <h3 class="font-bold text-pink-900 mb-4">⏰ 3. 時間與詳情</h3>
          <div class="grid grid-cols-2 gap-4 mb-4">
            <select id="start-time" class="input-pink" onchange="calc()"></select>
            <select id="end-time" class="input-pink" onchange="calc()"></select>
          </div>
          <div class="space-y-4">
            <input type="text" id="user-name" placeholder="預約人姓名" class="input-pink">
            <input type="tel" id="user-phone" placeholder="WhatsApp 號碼" class="input-pink">
            <div class="flex items-center gap-2">
              <input type="checkbox" id="video-service" onchange="calc()">
              <label class="text-sm font-bold text-pink-900">📹 加購錄影服務 (房A專屬)</label>
            </div>
            <div class="p-4 bg-yellow-50 rounded-lg border-2 border-yellow-200">
              <p class="text-lg font-bold text-pink-600 text-center">總計費用: <span id="total-price">$0</span></p>
            </div>
            <button id="submit-btn" onclick="submitBooking()" class="btn-primary w-full text-lg">📝 提交預約</button>
          </div>
        </div>
      </section>

      <aside id="staff-sidebar" class="w-80 bg-white border-l-4 border-pink-200 overflow-y-auto p-4 hidden">
        <h3 class="font-bold text-pink-900 mb-4 flex items-center gap-2">📋 預約清單</h3>
        <div id="booking-list" class="space-y-4"></div>
      </aside>
    </main>
  </div>

  <script>
    // --- 1. Firebase 配置 ---
    const firebaseConfig = {
      apiKey: "AIzaSyDEcKa0OlmdJXowWV-Esr5EAgYoHRMaCfs",
      authDomain: "cms-booking-c8bad.firebaseapp.com",
      databaseURL: "https://cms-booking-c8bad-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "cms-booking-c8bad",
      storageBucket: "cms-booking-c8bad.firebasestorage.app",
      messagingSenderId: "994097211619",
      appId: "1:994097211619:web:bc1626b253b02381ca3dd6"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const bookingsRef = db.ref('bookings');

    // --- 2. 資料集 ---
    const rooms = [
      { id: 'A', name: '房A', sub: '(三角琴)', rates: { weekday: 280, weekend: 380 }, vRates: { weekday: 580, weekend: 680 }, hasVideo: true },
      { id: 'B', name: '房B', sub: '(直身琴)', rates: { weekday: 60, weekend: 90 } },
      { id: 'C', name: '房C', sub: '(數碼琴)', rates: { weekday: 60, weekend: 90 } },
      { id: 'D', name: '房D', sub: '(直身琴)', rates: { weekday: 60, weekend: 90 } },
      { id: 'E', name: '房E', sub: '(直身琴)', rates: { weekday: 60, weekend: 90 } },
      { id: '1', name: '房1', sub: '(活動房)', rates: { weekday: 100, weekend: 150 } },
      { id: '2', name: '房2', sub: '(伴奏)', rates: { weekday: 80, weekend: 120 } }
    ];

    const publicHolidays = { 
        '2026-05-01': '勞動節', '2026-05-25': '佛誕', '2026-06-19': '端午節', '2026-07-01': '特區成立', 
        '2026-10-01': '國慶', '2026-12-25': '聖誕' 
    };

    let bookings = [];
    let selectedDates = [];
    let currentRoom = null;
    let viewMonth = new Date();
    let isStaffMode = false;

    // --- 3. 核心邏輯 ---
    function enterMode(mode) {
      if (mode === 'staff') {
        if (document.getElementById('staff-pw').value !== 'kaya2026') return alert('密碼錯誤');
        isStaffMode = true;
        document.getElementById('staff-sidebar').classList.remove('hidden');
        document.getElementById('stats').classList.remove('hidden');
      }
      document.getElementById('login-overlay').style.display = 'none';
      document.getElementById('app-content').style.display = 'flex';
      init();
    }

    function init() {
      // 房間渲染
      const grid = document.getElementById('room-grid');
      rooms.forEach(r => {
        const div = document.createElement('div');
        div.className = 'room-card text-xs font-bold';
        div.innerHTML = `${r.name}<br>${r.sub}`;
        div.onclick = () => {
          currentRoom = r;
          document.querySelectorAll('.room-card').forEach(el => el.classList.remove('active'));
          div.classList.add('active');
          calc();
        };
        grid.appendChild(div);
      });

      // 時間下拉
      const start = document.getElementById('start-time');
      const end = document.getElementById('end-time');
      for (let h = 8; h <= 21; h++) {
        [0, 30].forEach(m => {
          const t = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
          start.innerHTML += `<option value="${t}">${t}</option>`;
          end.innerHTML += `<option value="${t}">${t}</option>`;
        });
      }
      end.innerHTML += `<option value="22:00">22:00</option>`;
      end.value = "09:00";

      // 監聽雲端資料
      bookingsRef.on('value', snap => {
        const data = snap.val();
        bookings = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
        renderCalendar();
        if (isStaffMode) renderList();
      });
    }

    function renderCalendar() {
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';
      const year = viewMonth.getFullYear();
      const month = viewMonth.getMonth();
      document.getElementById('calendar-month').innerText = `${year}年 ${month+1}月`;

      const firstDay = new Date(year, month, 1).getDay();
      const days = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) grid.appendChild(document.createElement('div'));

      for (let d = 1; d <= days; d++) {
        const dateStr = `${year}-${(month+1).toString().padStart(2,'0')}-${d.toString().padStart(2,'0')}`;
        const date = new Date(year, month, d);
        const dayDiv = document.createElement('div');
        dayDiv.className = 'calendar-day';
        dayDiv.innerHTML = `<span>${d}</span>`;
        
        if (publicHolidays[dateStr] || date.getDay() === 0 || date.getDay() === 6) dayDiv.classList.add('red-circle');
        if (bookings.some(b => b.start_date === dateStr)) dayDiv.classList.add('has-booking');
        if (selectedDates.includes(dateStr)) dayDiv.classList.add('selected');
        if (publicHolidays[dateStr]) dayDiv.innerHTML += `<div class="holiday-badge">${publicHolidays[dateStr]}</div>`;

        dayDiv.onclick = () => {
          if (selectedDates.includes(dateStr)) selectedDates = selectedDates.filter(s => s !== dateStr);
          else selectedDates.push(dateStr);
          renderCalendar();
          calc();
        };
        grid.appendChild(dayDiv);
      }
    }

    function changeMonth(step) {
      viewMonth.setMonth(viewMonth.getMonth() + step);
      renderCalendar();
    }

    function calc() {
      if (!currentRoom || selectedDates.length === 0) return;
      const s = document.getElementById('start-time').value.split(':');
      const e = document.getElementById('end-time').value.split(':');
      const dur = (parseInt(e[0])*60 + parseInt(e[1])) - (parseInt(s[0])*60 + parseInt(s[1]));
      if (dur <= 0) return document.getElementById('total-price').innerText = '時間錯誤';

      let total = 0;
      selectedDates.forEach(d => {
        const isHoli = publicHolidays[d] || [0, 6].includes(new Date(d).getDay());
        const useVideo = document.getElementById('video-service').checked && currentRoom.id === 'A';
        let rate = isHoli ? currentRoom.rates.weekend : currentRoom.rates.weekday;
        if (useVideo) rate = isHoli ? currentRoom.vRates.weekend : currentRoom.vRates.weekday;
        total += (rate * (dur / 60));
      });
      document.getElementById('total-price').innerText = `$${Math.round(total)}`;
    }

    async function submitBooking() {
      const name = document.getElementById('user-name').value;
      const phone = document.getElementById('user-phone').value;
      if (!name || !phone || !currentRoom || selectedDates.length === 0) return alert('請填寫完整');

      const price = document.getElementById('total-price').innerText.replace('$','');
      
      for (const d of selectedDates) {
        await bookingsRef.push({
          room_id: currentRoom.id,
          start_date: d,
          start_time: document.getElementById('start-time').value,
          end_time: document.getElementById('end-time').value,
          user_name: name,
          phone: phone,
          total_amount: parseInt(price) / selectedDates.length,
          payment_status: 'pending',
          created_at: new Date().toISOString()
        });
      }
      alert('預約成功！請等候通知。');
      location.reload();
    }

    function renderList() {
      const list = document.getElementById('booking-list');
      list.innerHTML = '';
      let income = 0;
      bookings.sort((a,b) => b.start_date.localeCompare(a.start_date)).forEach(b => {
        if (b.payment_status === 'paid') income += b.total_amount;
        const div = document.createElement('div');
        div.className = 'booking-card text-xs';
        div.innerHTML = `
          <div class="flex justify-between font-bold mb-1">
            <span>房${b.room_id} - ${b.user_name}</span>
            <span class="status-badge ${b.payment_status==='paid'?'status-paid':'status-pending'}">${b.payment_status==='paid'?'已付':'待付'}</span>
          </div>
          <p>📅 ${b.start_date} (${b.start_time}-${b.end_time})</p>
          <p>📞 ${b.phone} | 💰 $${b.total_amount}</p>
          <div class="flex gap-2 mt-2">
            ${b.payment_status==='pending'?`<button onclick="updatePay('${b.id}')" class="bg-green-500 text-white px-2 py-1 rounded">收錢</button>`:''}
            <button onclick="del('${b.id}')" class="bg-red-500 text-white px-2 py-1 rounded">刪除</button>
          </div>
        `;
        list.appendChild(div);
      });
      document.getElementById('month-income').innerText = `$${Math.round(income)}`;
    }

    window.updatePay = id => db.ref('bookings/'+id).update({ payment_status: 'paid' });
    window.del = id => confirm('確定刪除?') && db.ref('bookings/'+id).remove();

  </script>
</body>
</html>
